#########################################
#  Configuracao do CLIENTE Firebird 3.0 embarcado no agente da Sinsoft.
#
#  Escrito a mao de proposito. NAO copie o firebird.conf de uma instalacao
#  servidor para ca: ele traz coisas da maquina de origem que quebram o
#  cliente sem dar pista nenhuma. Ja aconteceu — veio com
#  `RemoteServicePort = 3051` duplicado, e o gbak passou a discar a porta
#  errada em toda prefeitura, reportando como erro de rede.
#
#  A porta vem SEMPRE na string de conexao montada pelo agente. Nao defina
#  RemoteServicePort aqui.
#########################################

# Ordem dos plugins de autenticacao.
#
# Legacy_Auth primeiro porque as bases da casa tem os usuarios na base de
# seguranca legada (`UserManager = Legacy_UserManager` nos servidores). O
# padrao de fabrica do cliente e Srp na frente, que falha nesses servidores
# com "Authentication error" — o usuario simplesmente nao existe no Srp.
AuthClient = Legacy_Auth, Srp, Win_Sspi

# Legacy_Auth nao gera chave de criptografia, entao exigir cifra na conexao
# impediria o login. Os servidores da casa tambem estao em Disabled.
WireCrypt = Disabled
