# ==========================================================
#  OPCIONAL: varias instancias do agente (redundancia/carga)
#  So use se UMA instancia nao der conta (raro). Rode N processos
#  do agente em portas diferentes (3060, 3061, 3062) e o nginx
#  distribui. O agente e sem estado, entao balancear e seguro.
# ==========================================================
worker_processes  1;
events { worker_connections  1024; }

http {
    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 5m;

    upstream agente_firebird {
        least_conn;                 # manda pra instancia menos ocupada
        server 127.0.0.1:3060;
        server 127.0.0.1:3061;
        server 127.0.0.1:3062;
    }

    server {
        listen       1000;
        server_name  _;
        location / {
            proxy_pass         http://agente_firebird;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
