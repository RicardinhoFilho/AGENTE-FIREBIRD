# ==========================================================
#  nginx.conf - Agente Firebird (Sananduva)
#  So o agente roda na prefeitura. Todos os sistemas da nuvem
#  batem aqui, cada um mandando seu proprio banco+SQL.
#
#  internet -> borda -> nginx :1000 -> agente :3060
#  Substitua C:\nginx\conf\nginx.conf por este e: nginx -s reload
# ==========================================================
worker_processes  1;
events { worker_connections  1024; }

http {
    sendfile           on;
    keepalive_timeout  65;

    # O agente aceita ate 2MB de JSON (consultas/lotes grandes). Deixa folga.
    client_max_body_size 5m;

    server {
        listen       1000;
        server_name  _;

        location / {
            proxy_pass         http://127.0.0.1:3060;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # ESSENCIAL: leva o IP real da nuvem ate o agente (IPS_PERMITIDOS).
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Lotes de relatorio podem demorar; nao corte cedo.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
